<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Farming Simulator 3D</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
    <div id="main-menu" class="ui-screen">
        <div class="menu-container">
            <h1>Ultimate Farming Simulator 3D</h1>
            <p>Polska Wieś - Edycja Mobilna</p>
            <button class="btn-primary" onclick="GameApp.startNewGame()">Nowa Gra</button>
            <button class="btn-secondary" onclick="GameApp.loadGame()">Kontynuuj</button>
            <button class="btn-secondary" onclick="GameApp.openShop()">Sklep</button>
            <button class="btn-secondary" onclick="GameApp.openGarage()">Garaż</button>
        </div>
    </div>

    <div id="game-hud" class="ui-screen hidden">
        <div id="top-bar">
            <span id="hud-money">PLN: 15000</span>
            <span id="hud-time">12:00</span>
            <span id="hud-fps">FPS: 60</span>
        </div>

        <div id="joystick-zone">
            <div id="joystick-base">
                <div id="joystick-stick"></div>
            </div>
        </div>

        <div id="action-controls">
            <button id="btn-action" class="hud-btn" onclick="GameApp.triggerAction()">Akcja</button>
            <button id="btn-camera" class="hud-btn" onclick="GameApp.switchCamera()">Kamera</button>
            <div id="vehicle-controls" class="hidden">
                <button class="hud-btn" ontouchstart="GameApp.vehicleGas(1)" ontouchend="GameApp.vehicleGas(0)">Gaz</button>
                <button class="hud-btn" ontouchstart="GameApp.vehicleBrake(1)" ontouchend="GameApp.vehicleBrake(0)">Stop</button>
            </div>
        </div>
    </div>

    <div id="shop-modal" class="ui-screen hidden">
        <div class="modal-content">
            <h2>Sklep Rolniczy</h2>
            <div id="shop-items"></div>
            <button class="btn-secondary" onclick="GameApp.closeShop()">Zamknij</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="save-system.js"></script>
    <script src="touch-controls.js"></script>
    <script src="world.js"></script>
    <script src="player.js"></script>
    <script src="vehicles.js"></script>
    <script src="farming.js"></script>
    <script src="economy.js"></script>
    <script src="shop.js"></script>
    <script src="game.js"></script>
    <script src="main.js"></script>
</body>
</html>
